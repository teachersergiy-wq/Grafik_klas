<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Графік чергування — 7 клас</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #fff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 { font-size: 1.35rem; margin-bottom: 4px; }
    h2 { font-size: 1.1rem; margin: 16px 0 8px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .duty-big {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      padding: 20px 12px;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      border-radius: 12px;
      margin: 12px 0;
    }
    .duty-big .label { font-size: 0.85rem; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
    button, .btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      background: var(--primary);
      color: #fff;
    }
    button:active, .btn:active { opacity: .9; }
    button.secondary { background: #e2e8f0; color: var(--text); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 6px;
    }
    label { display: block; margin-top: 12px; font-weight: 500; }
    .student-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .student-row:last-child { border-bottom: none; }
    .student-row input[type="checkbox"] { width: 24px; height: 24px; flex-shrink: 0; }
    .student-name { flex: 1; }
    .pct { font-size: 0.85rem; color: var(--muted); min-width: 52px; text-align: right; }
    .role-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #dbeafe;
      color: var(--primary-dark);
    }
    .hidden { display: none !important; }
    .error { color: var(--danger); margin-top: 8px; }
    .ok { color: var(--success); margin-top: 8px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button { flex: 1; margin-top: 0; background: #e2e8f0; color: var(--text); }
    .tabs button.active { background: var(--primary); color: #fff; }
    .login-box { margin-top: 16px; }
    footer { text-align: center; margin-top: 24px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Чергування 7 класу</h1>
  <p class="muted" id="todayLabel"></p>

  <div class="card">
    <div id="dutyView" class="duty-big">
      <span class="label">Сьогодні черговий</span>
      <span id="dutyName">—</span>
    </div>
    <p class="muted" id="dutyHint"></p>
  </div>

  <div id="authSection" class="card">
    <div id="loggedOut">
      <p>Для внесення даних увійдіть токеном GitHub.</p>
      <label>Токен (fine-grained, Contents: Read and write)</label>
      <input type="password" id="tokenInput" placeholder="ghp_... або github_pat_..." autocomplete="off">
      <button id="btnLogin">Увійти</button>
      <p class="error hidden" id="loginError"></p>
    </div>
    <div id="loggedIn" class="hidden">
      <p>Ви: <strong id="userLogin"></strong> <span class="role-badge" id="userRole"></span></p>
      <button class="secondary" id="btnLogout">Вийти</button>
    </div>
  </div>

  <div id="editorSection" class="hidden">
    <div class="tabs">
      <button type="button" class="active" data-tab="today">Сьогодні</button>
      <button type="button" data-tab="students">Учні</button>
      <button type="button" data-tab="history">Історія</button>
    </div>

    <div id="tab-today" class="card">
      <h2>Присутність на <span id="editDateLabel"></span></h2>
      <p class="muted" id="timeWindowHint"></p>
      <div id="absentList"></div>
      <button id="btnSaveDay">Зберегти присутність і призначити чергового</button>
      <button class="secondary hidden" id="btnClearDay">Скасувати запис за день</button>
      <p class="error hidden" id="saveError"></p>
      <p class="ok hidden" id="saveOk"></p>
    </div>

    <div id="tab-students" class="card hidden">
      <h2>Список учнів</h2>
      <div id="studentsManage"></div>
      <h2 style="margin-top:20px">Додати учня</h2>
      <label>Ім’я (Прізвище І.)</label>
      <input type="text" id="newName" placeholder="Петренко О.">
      <label>Днів у школі до початку (b)</label>
      <input type="number" id="newB" value="0" min="0">
      <label>Разів чергував до початку (ch)</label>
      <input type="number" id="newCh" value="0" min="0">
      <button id="btnAddStudent">Додати</button>
      <p class="error hidden" id="studError"></p>
    </div>

    <div id="tab-history" class="card hidden">
      <h2>Історія / інша дата</h2>
      <label>Дата</label>
      <input type="date" id="histDate">
      <button class="secondary" id="btnLoadDate">Відкрити дату</button>
      <div id="histInfo" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="card" id="statsCard">
    <h2>Статистика учнів</h2>
    <div id="statsList"></div>
  </div>

  <footer>Дані зберігаються в репозиторії GitHub · без сервера</footer>

  <script>
  const CFG = {
    owner: "teachersergiy-wq",
    repo: "Grafik_klas",
    file: "data.json",
    teacher: "teacher",
    head: "starosta"
  };

  let data = { students: [], days: {} };
  let token = localStorage.getItem("gk_token") || "";
  let userLogin = "";
  let role = "viewer"; // viewer | head | teacher
  let editDate = todayStr();
  let dataSha = null;

  function todayStr() {
    return new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Kyiv" });
  }

  function kyivNow() {
    return new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Kyiv" }));
  }

  function isWeekdayKyiv() {
    const d = kyivNow().getDay();
    return d >= 1 && d <= 5;
  }

  function isHeadTimeWindow() {
    if (!isWeekdayKyiv()) return false;
    const n = kyivNow();
    const mins = n.getHours() * 60 + n.getMinutes();
    return mins >= 8 * 60 && mins < 10 * 60 + 40;
  }

  function apiUrl(path) {
    return `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}`;
  }

  async function loadData() {
    try {
      const r = await fetch(apiUrl(CFG.file) + "?ref=main", {
        headers: token ? { Authorization: "Bearer " + token } : {}
      });
      if (!r.ok) throw new Error("Не вдалося завантажити дані");
      const j = await r.json();
      dataSha = j.sha;
      const text = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
      data = JSON.parse(text);
      if (!data.students) data.students = [];
      if (!data.days) data.days = {};
    } catch (e) {
      console.error(e);
      try {
        const r2 = await fetch(`https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/main/${CFG.file}?t=` + Date.now());
        data = await r2.json();
        dataSha = null;
      } catch (e2) {
        data = { students: [], days: {} };
      }
    }
    renderAll();
  }

  async function saveData(msg) {
    if (!token) throw new Error("Немає токена");
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = {
      message: msg || "Оновлення графіка чергування",
      content,
      branch: "main"
    };
    if (dataSha) body.sha = dataSha;
    const r = await fetch(apiUrl(CFG.file), {
      method: "PUT",
      headers: {
        Authorization: "Bearer " + token,
        "Content-Type": "application/json",
        Accept: "application/vnd.github+json"
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.message || "Помилка збереження");
    }
    const j = await r.json();
    dataSha = j.content.sha;
  }

  async function checkUser() {
    if (!token) {
      role = "viewer";
      userLogin = "";
      return;
    }
    try {
      const r = await fetch("https://api.github.com/user", {
        headers: { Authorization: "Bearer " + token }
      });
      if (!r.ok) throw new Error("Токен недійсний");
      const u = await r.json();
      userLogin = u.login;
      if (userLogin === CFG.teacher) role = "teacher";
      else if (CFG.head && userLogin === CFG.head) role = "head";
      else role = "viewer";
    } catch (e) {
      token = "";
      localStorage.removeItem("gk_token");
      role = "viewer";
      userLogin = "";
      throw e;
    }
  }

  function studentById(id) {
    return data.students.find(s => s.id === id);
  }

  function calcPct(s) {
    if (!s.b || s.b <= 0) return s.ch > 0 ? 1 : 0;
    return s.ch / s.b;
  }

  function pickDuty(absentIds) {
    const present = data.students.filter(s => !absentIds.includes(s.id));
    if (!present.length) return null;
    present.sort((a, b) => {
      const pa = calcPct(a), pb = calcPct(b);
      if (Math.abs(pa - pb) > 1e-9) return pa - pb;
      if (a.ch !== b.ch) return a.ch - b.ch;
      return a.name.localeCompare(b.name, "uk");
    });
    return present[0].id;
  }

  function dayRecord(date) {
    return data.days[date] || null;
  }

  function renderDuty() {
    const t = todayStr();
    document.getElementById("todayLabel").textContent = "Сьогодні: " + formatDateUk(t);
    const rec = dayRecord(t);
    const dutyEl = document.getElementById("dutyName");
    const hint = document.getElementById("dutyHint");
    if (!rec || !rec.duty) {
      dutyEl.textContent = "ще не призначено";
      hint.textContent = "Черговий з’явиться після збереження присутності за сьогодні.";
    } else {
      const st = studentById(rec.duty);
      dutyEl.textContent = st ? st.name : "id " + rec.duty;
      const abs = (rec.absent || []).map(id => {
        const s = studentById(id);
        return s ? s.name : id;
      });
      hint.textContent = abs.length ? "Відсутні: " + abs.join(", ") : "Усі присутні";
    }
  }

  function formatDateUk(iso) {
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }

  function renderStats() {
    const list = document.getElementById("statsList");
    if (!data.students.length) {
      list.innerHTML = "<p class='muted'>Учнів ще немає. Додайте їх у вкладці «Учні».</p>";
      return;
    }
    const sorted = [...data.students].sort((a, b) => a.name.localeCompare(b.name, "uk"));
    list.innerHTML = sorted.map(s => {
      const pct = (calcPct(s) * 100).toFixed(1);
      return `<div class="student-row">
        <span class="student-name">${escapeHtml(s.name)}</span>
        <span class="pct">${s.ch}/${s.b} (${pct}%)</span>
      </div>`;
    }).join("");
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&")
      .replace(/</g, "<")
      .replace(/>/g, ">")
      .replace(/"/g, """);
  }

  function renderAuth() {
    const out = document.getElementById("loggedOut");
    const inn = document.getElementById("loggedIn");
    if (userLogin && role !== "viewer") {
      out.classList.add("hidden");
      inn.classList.remove("hidden");
      document.getElementById("userLogin").textContent = userLogin;
      document.getElementById("userRole").textContent = role === "teacher" ? "класний керівник" : "староста";
      document.getElementById("editorSection").classList.remove("hidden");
    } else {
      out.classList.remove("hidden");
      inn.classList.add("hidden");
      document.getElementById("editorSection").classList.add("hidden");
      if (userLogin && role === "viewer") {
        document.getElementById("loginError").textContent = "Цей логін не має прав редагування.";
        document.getElementById("loginError").classList.remove("hidden");
      }
    }
  }

  function canEditDay(date) {
    if (role === "teacher") return true;
    if (role !== "head") return false;
    if (date !== todayStr()) return false;
    if (!isHeadTimeWindow()) return false;
    const rec = dayRecord(date);
    if (rec && (rec.duty || (rec.absent && rec.absent.length))) return false;
    return true;
  }

  function renderEditor() {
    editDate = editDate || todayStr();
    document.getElementById("editDateLabel").textContent = formatDateUk(editDate);
    const hint = document.getElementById("timeWindowHint");
    const can = canEditDay(editDate);
    if (role === "head") {
      if (editDate !== todayStr()) {
        hint.textContent = "Староста може вносити лише сьогодні.";
      } else if (!isWeekdayKyiv()) {
        hint.textContent = "Староста вносить дані лише в будні.";
      } else if (!isHeadTimeWindow()) {
        hint.textContent = "Вікно для старости: 8:00–10:40 (Київ). Зараз закрито.";
      } else if (dayRecord(editDate)) {
        hint.textContent = "Запис за сьогодні вже є. Змінювати може лише класний керівник.";
      } else {
        hint.textContent = "Можна зберегти присутність один раз.";
      }
    } else {
      hint.textContent = "Класний керівник може змінювати будь-яку дату.";
    }

    const list = document.getElementById("absentList");
    const rec = dayRecord(editDate) || { absent: [], duty: null };
    const absentSet = new Set(rec.absent || []);
    if (!data.students.length) {
      list.innerHTML = "<p class='muted'>Спочатку додайте учнів.</p>";
    } else {
      const sorted = [...data.students].sort((a, b) => a.name.localeCompare(b.name, "uk"));
      list.innerHTML = sorted.map(s => {
        const checked = absentSet.has(s.id) ? "checked" : "";
        const dis = can ? "" : "disabled";
        return `<div class="student-row">
          <input type="checkbox" data-id="${s.id}" ${checked} ${dis}>
          <span class="student-name">${escapeHtml(s.name)}</span>
          <span class="pct">${s.ch}/${s.b}</span>
        </div>`;
      }).join("");
    }

    document.getElementById("btnSaveDay").disabled = !can;
    document.getElementById("btnClearDay").classList.toggle("hidden", !(role === "teacher" && dayRecord(editDate)));
    document.getElementById("saveError").classList.add("hidden");
    document.getElementById("saveOk").classList.add("hidden");

    const sm = document.getElementById("studentsManage");
    if (!data.students.length) sm.innerHTML = "<p class='muted'>Порожньо</p>";
    else {
      sm.innerHTML = data.students
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, "uk"))
        .map(s => `<div class="student-row">
          <span class="student-name">${escapeHtml(s.name)} <span class="muted">(id ${s.id})</span></span>
          ${role === "teacher" ? `<button type="button" class="secondary" style="width:auto;min-height:36px;padding:6px 10px;margin:0" data-del="${s.id}">Видалити</button>` : ""}
        </div>`).join("");
      sm.querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = () => deleteStudent(btn.dataset.del);
      });
    }

    document.getElementById("histDate").value = editDate;
  }

  function renderAll() {
    renderDuty();
    renderStats();
    renderAuth();
    if (role === "teacher" || role === "head") renderEditor();
  }

  document.getElementById("btnLogin").onclick = async () => {
    const t = document.getElementById("tokenInput").value.trim();
    const err = document.getElementById("loginError");
    err.classList.add("hidden");
    if (!t) { err.textContent = "Введіть токен"; err.classList.remove("hidden"); return; }
    token = t;
    try {
      await checkUser();
      if (role === "viewer") {
        err.textContent = "Логін не є класним керівником або старостою.";
        err.classList.remove("hidden");
        token = "";
        return;
      }
      localStorage.setItem("gk_token", token);
      await loadData();
    } catch (e) {
      err.textContent = e.message || "Помилка входу";
      err.classList.remove("hidden");
      token = "";
    }
  };

  document.getElementById("btnLogout").onclick = () => {
    token = "";
    userLogin = "";
    role = "viewer";
    localStorage.removeItem("gk_token");
    renderAll();
  };

  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      ["today", "students", "history"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", btn.dataset.tab !== t);
      });
    };
  });

  document.getElementById("btnSaveDay").onclick = async () => {
    const err = document.getElementById("saveError");
    const ok = document.getElementById("saveOk");
    err.classList.add("hidden");
    ok.classList.add("hidden");
    if (!canEditDay(editDate)) {
      err.textContent = "Немає права зберегти цей день.";
      err.classList.remove("hidden");
      return;
    }
    const absent = [];
    document.querySelectorAll("#absentList input[type=checkbox]").forEach(cb => {
      if (cb.checked) absent.push(cb.dataset.id);
    });
    const duty = pickDuty(absent);
    if (!duty) {
      err.textContent = "Немає присутніх учнів для чергування.";
      err.classList.remove("hidden");
      return;
    }
    const prev = dayRecord(editDate);
    if (prev) {
      reverseDay(prev);
    }
    data.days[editDate] = { absent, duty };
    applyDay(data.days[editDate]);
    try {
      await saveData(`Присутність і черговий за ${editDate}`);
      ok.textContent = "Збережено. Черговий: " + (studentById(duty)?.name || duty);
      ok.classList.remove("hidden");
      renderAll();
    } catch (e) {
      reverseDay(data.days[editDate]);
      if (prev) {
        data.days[editDate] = prev;
        applyDay(prev);
      } else delete data.days[editDate];
      err.textContent = e.message;
      err.classList.remove("hidden");
    }
  };

  function applyDay(rec) {
    const absent = new Set(rec.absent || []);
    data.students.forEach(s => {
      if (!absent.has(s.id)) s.b = (s.b || 0) + 1;
      if (s.id === rec.duty) s.ch = (s.ch || 0) + 1;
    });
  }
  function reverseDay(rec) {
    const absent = new Set(rec.absent || []);
    data.students.forEach(s => {
      if (!absent.has(s.id)) s.b = Math.max(0, (s.b || 0) - 1);
      if (s.id === rec.duty) s.ch = Math.max(0, (s.ch || 0) - 1);
    });
  }

  document.getElementById("btnClearDay").onclick = async () => {
    if (role !== "teacher") return;
    const rec = dayRecord(editDate);
    if (!rec) return;
    if (!confirm("Скасувати запис за " + formatDateUk(editDate) + "?")) return;
    reverseDay(rec);
    delete data.days[editDate];
    try {
      await saveData(`Скасовано запис за ${editDate}`);
      renderAll();
    } catch (e) {
      applyDay(rec);
      data.days[editDate] = rec;
      alert(e.message);
    }
  };

  document.getElementById("btnAddStudent").onclick = async () => {
    if (role !== "teacher" && role !== "head") return;
    const name = document.getElementById("newName").value.trim();
    const b = parseInt(document.getElementById("newB").value, 10) || 0;
    const ch = parseInt(document.getElementById("newCh").value, 10) || 0;
    const err = document.getElementById("studError");
    err.classList.add("hidden");
    if (!name) { err.textContent = "Вкажіть ім’я"; err.classList.remove("hidden"); return; }
    const id = String(Date.now());
    data.students.push({ id, name, b, ch });
    try {
      await saveData("Додано учня " + name);
      document.getElementById("newName").value = "";
      renderAll();
    } catch (e) {
      data.students.pop();
      err.textContent = e.message;
      err.classList.remove("hidden");
    }
  };

  async function deleteStudent(id) {
    if (role !== "teacher") return;
    if (!confirm("Видалити учня?")) return;
    const idx = data.students.findIndex(s => s.id === id);
    if (idx < 0) return;
    const removed = data.students.splice(idx, 1)[0];
    try {
      await saveData("Видалено учня " + removed.name);
      renderAll();
    } catch (e) {
      data.students.splice(idx, 0, removed);
      alert(e.message);
    }
  }

  document.getElementById("btnLoadDate").onclick = () => {
    const d = document.getElementById("histDate").value;
    if (!d) return;
    editDate = d;
    document.querySelector('.tabs button[data-tab="today"]').click();
    renderEditor();
    const rec = dayRecord(d);
    const info = document.getElementById("histInfo");
    if (!rec) info.innerHTML = "<p class='muted'>Записів немає</p>";
    else {
      const st = studentById(rec.duty);
      info.innerHTML = `<p>Черговий: <strong>${st ? escapeHtml(st.name) : rec.duty}</strong></p>
        <p class="muted">Відсутні: ${(rec.absent||[]).map(id => studentById(id)?.name || id).join(", ") || "—"}</p>`;
    }
  };

  (async () => {
    if (token) {
      try { await checkUser(); } catch (e) { token = ""; }
    }
    await loadData();
  })();
  </script>
</body>
</html>
